name: Build ToolKit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld make git curl xz-utils \
            libplist-dev pkg-config \
            libssl-dev build-essential

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/sdks
          cd $HOME/sdks
          curl -L --fail -o iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz

      - name: Install ldid
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git submodule update --init
          make CXX=clang++
          sudo cp ldid /usr/local/bin/

      - name: Build dylib
        run: |
          SDK=$HOME/sdks/iPhoneOS16.5.sdk
          SRC=$(find src -name "*.mm" | tr '\n' ' ')
          echo "Sources: $SRC"
          clang++ \
            -target arm64-apple-ios14.0 \
            -dynamiclib \
            -isysroot "$SDK" \
            -fuse-ld=lld \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -install_name @rpath/libtool.dylib \
            -Isrc -Isrc/core -Isrc/ui -Isrc/ai -Isrc/dump \
            -o libtool.dylib \
            $SRC

      - name: Sign dylib
        run: |
          ldid -S libtool.dylib
          ls -la libtool.dylib

      - name: Create .so
        run: |
          cp libtool.dylib libtool.so
          ls -la *.dylib *.so

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libtool-dylib
          path: libtool.dylib

      - name: Upload so
        uses: actions/upload-artifact@v4
        with:
          name: libtool-so
          path: libtool.so
