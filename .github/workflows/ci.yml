name: Build dylib CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Lua source code
      run: |
        # Tải mã nguồn Lua chính thức để tự động có đủ lua.h, lauxlib.h, lualib.h
        curl -R -O https://www.lua.org/ftp/lua-5.4.6.tar.gz
        tar zxf lua-5.4.6.tar.gz

    - name: Compile dynamic library (.dylib)
      run: |
        # Biên dịch main.mm cùng với mã nguồn Lua vừa tải về
        clang++ -shared -undefined dynamic_lookup \
          -x objective-c++ -std=c++17 -fobjc-arc \
          main.mm \
          lua-5.4.6/src/*.c \
          -I lua-5.4.6/src \
          -framework Foundation \
          -o libautodance.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autodance-dylib
        path: libautodance.dylib
