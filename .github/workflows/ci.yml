name: Build dylib CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Lua)
      run: |
        brew install lua

    - name: Compile dynamic library (.dylib for iOS)
      run: |
        # Sử dụng xcrun --sdk iphoneos để trình biên dịch nhận diện đầy đủ UIKit và Foundation của iOS
        xcrun --sdk iphoneos clang++ -shared -undefined dynamic_lookup \
          -x objective-c++ -std=c++17 -fobjc-arc \
          main.mm \
          -framework Foundation \
          -framework UIKit \
          -I$(brew --prefix lua)/include \
          -L$(brew --prefix lua)/lib \
          -llua \
          -o libautodance.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autodance-dylib
        path: libautodance.dylib
