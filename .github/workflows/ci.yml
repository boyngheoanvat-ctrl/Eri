name: Build dylib CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile as Dynamic Library (.dylib)
      run: |
        # Biên dịch file main.mm thành libmain.dylib
        clang++ -shared -undefined dynamic_lookup -x objective-c++ -std=c++17 -fobjc-arc main.mm -framework Foundation -o libmain.dylib

    # Thêm bước này để lưu file .dylib thành artifact có thể tải về
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: libmain.dylib
