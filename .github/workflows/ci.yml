name: Build dylib CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile dynamic library (.dylib)
      run: |
        # Biên dịch main.mm thành libautodance.dylib (cần trỏ include/lib lua nếu có)
        clang++ -shared -undefined dynamic_lookup -x objective-c++ -std=c++17 -fobjc-arc main.mm -framework Foundation -framework UIKit -o libautodance.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autodance-dylib
        path: libautodance.dylib
